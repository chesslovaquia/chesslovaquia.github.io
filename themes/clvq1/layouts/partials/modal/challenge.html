<div id="lichessChallengeModal" class="modal-container">
	<div class="modal-inner" style="text-align:center;">
		<p style="margin-bottom:var(--clvq-space-sm);">
			<span id="lichessChallengerName" style="color:var(--clvq-accent);"></span>
			<span id="lichessChallengerRating" style="color:var(--clvq-text-dim); font-size:var(--clvq-font-sm);"></span>
			challenges you!
		</p>
		<p id="lichessChallengeTimeCtrl" style="font-size:var(--clvq-font-sm); margin-bottom:var(--clvq-space-sm);"></p>
		<div style="display:flex; gap:var(--clvq-space-xs); justify-content:center;">
			<button class="btn" onclick="Clvq.lichessDeclineChallenge()">Decline</button>
			<button class="btn" onclick="Clvq.lichessAcceptChallenge()">Accept</button>
		</div>
	</div>
</div>
