<div id="lichessSeekModal" class="modal-container">
	<div class="modal-inner" style="text-align:center;">
		<p style="margin-bottom:var(--clvq-space-sm);">Choose a time control to seek a game:</p>
		<div style="display:flex; flex-wrap:wrap; gap:var(--clvq-space-xs); justify-content:center; margin-bottom:var(--clvq-space-xs);">
			<button class="btn" onclick="lichessSeek(10, 0)">10+0</button>
			<button class="btn" onclick="lichessSeek(15, 10)">15+10</button>
			<button class="btn" onclick="lichessSeek(30, 0)">30+0</button>
			<button class="btn" onclick="lichessSeek(30, 20)">30+20</button>
		</div>
		<button class="btn" onclick="Clvq.w3HideModal('lichessSeekModal')">Cancel</button>
	</div>
</div>
<script>
	function lichessSeek(timeMinutes, incrementSeconds) {
		console.debug('Lichess seek:', timeMinutes, incrementSeconds);
		Clvq.w3HideModal('lichessSeekModal');
		Clvq.lichessSeek(timeMinutes, incrementSeconds);
	}
</script>
