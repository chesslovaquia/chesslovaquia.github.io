{{- $page := .page }}

{{ partial "modal/setup-custom.html" (dict "page" $page) }}
<div id="playModeSelector" class="play-mode-selector">
	<button class="btn play-mode-btn" onclick="Clvq.playModeToggle()">
		<span id="playModeLabel">Over the board</span>
		<i class="fa-solid fa-caret-down"></i>
	</button>
	<div id="playModeDropdown" class="play-mode-dropdown">
		<button class="btn play-mode-item" onclick="Clvq.playModeSelect('otb')">Over the board</button>
		<button class="btn play-mode-item" onclick="Clvq.playModeSelect('lichess')">Lichess</button>
	</div>
</div>
<p id="playModeLoginPrompt" class="play-mode-login-prompt" style="display:none">
	Log in to Lichess first (use sidebar menu).
</p>
{{ partial "game/playing-games.html" . }}
<div class="setup-grid">
	<button class="btn setup-btn" onclick="Clvq.play(1, 0)">1+0</button>
	<button class="btn setup-btn" onclick="Clvq.play(2, 1)">2+1</button>
	<button class="btn setup-btn" onclick="Clvq.play(3, 0)">3+0</button>
	<button class="btn setup-btn" onclick="Clvq.play(3, 2)">3+2</button>
	<button class="btn setup-btn" onclick="Clvq.play(5, 0)">5+0</button>
	<button class="btn setup-btn" onclick="Clvq.play(5, 3)">5+3</button>
	<button class="btn setup-btn" onclick="Clvq.play(10, 0)">10+0</button>
	<button class="btn setup-btn" onclick="Clvq.play(10, 5)">10+5</button>
	<button class="btn setup-btn" onclick="Clvq.play(15, 10)">15+10</button>
	<button class="btn setup-btn" onclick="Clvq.play(30, 0)">30+0</button>
	<button class="btn setup-btn" onclick="Clvq.play(30, 20)">30+20</button>
	<button class="btn setup-btn" onclick="Clvq.w3ShowModal('gameSetupCustom')">Custom</button>
</div>
