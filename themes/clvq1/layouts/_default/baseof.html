<!DOCTYPE html>
<html lang="{{ or site.Language.Locale }}"
      dir="{{ or site.Language.Direction `ltr` }}">
<head>
	{{- partial "head.html" . }}
</head>
<body>
	{{- if ne .Params.gamePage "load" }}
		{{- partial "sidebar-toggle.html" . }}
		{{- partial "sidebar.html" . }}
	{{- end }}
	<div class="{{ if ne .Params.gamePage "load" }}page-content{{ end }}">
		{{- block "main" . }}{{ end }}
	</div>
	{{- partial "global-modals.html" . }}
</body>
</html>
