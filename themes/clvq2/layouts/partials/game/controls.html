<div class="game-controls">
	<div class="game-menu">
		<button class="btn" aria-label="Game menu" onclick="Clvq.w3ToggleMenu('gameMenuDropdown')">
			<i class="fas fa-bars" aria-hidden="true"></i>
		</button>
		<div id="gameMenuDropdown" class="game-menu-dropdown">
			<a id="gameReset" href="javascript:void(0)" class="btn game-menu-item">Reset</a>
		</div>
	</div>
	<button id="gameFlipBoard" class="btn" aria-label="Flip board">
		<i class="fas fa-retweet" aria-hidden="true"></i>
	</button>
	<button id="gameNavFirstMove" class="btn" aria-label="First move">
		<i class="fas fa-angle-double-left" aria-hidden="true"></i>
	</button>
	<button id="gameNavBackward" class="btn" aria-label="Previous move">
		<i class="fas fa-angle-left" aria-hidden="true"></i>
	</button>
	<button id="gameNavForward" class="btn" aria-label="Next move">
		<i class="fas fa-angle-right" aria-hidden="true"></i>
	</button>
	<button id="gameNavLastMove" class="btn" aria-label="Last move">
		<i class="fas fa-angle-double-right" aria-hidden="true"></i>
	</button>
</div>

<!-- Online game actions (hidden until active) -->
<div id="gameActionsBar" class="game-actions" style="display:none">
	<a id="gameAbort" href="javascript:void(0)" class="btn"
		onclick="Clvq.lichessAbort()">Abort</a>
	<a id="gameResign" href="javascript:void(0)" class="btn"
		onclick="Clvq.lichessResign()">Resign</a>
	<a id="gameOfferDraw" href="javascript:void(0)" class="btn"
		onclick="Clvq.lichessOfferDraw()">Offer Draw</a>
</div>
