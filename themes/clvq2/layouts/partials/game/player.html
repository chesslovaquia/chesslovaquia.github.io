{{- $id := .id }}
<div class="player-bar">
	<div class="player-info">
		<div id="gamePlayer{{ $id }}" class="player-name"></div>
		<div id="gamePlayerRating{{ $id }}" class="player-rating" style="display:none"></div>
		<div class="player-material">
			<span id="gameMaterial{{ $id }}"></span>
			<span id="gameMaterialCount{{ $id }}" class="player-material-count"></span>
		</div>
	</div>
	<div id="gameClock{{ $id }}" class="game-clock"></div>
</div>
