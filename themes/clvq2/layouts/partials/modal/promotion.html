{{- $side := .side }}
<div id="{{ $side }}PawnPromotion" style="display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.7);">
	<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--clvq-bg-2); border-radius:var(--clvq-radius); padding:var(--clvq-space-md);">
		<div class="cg-wrap" style="display: grid; grid-template-columns: repeat(4, 50px); grid-template-rows: repeat(1, 50px);">
			<a href="javascript:void(0)" data-piece="q" class="clvq-promotion-piece">
				<piece class="queen {{ $side }}"
					style="grid-column: 1; grid-row: 1; width: 50px; height: 50px;">
				</piece>
			</a>
			<a href="javascript:void(0)" data-piece="r" class="clvq-promotion-piece">
				<piece class="rook {{ $side }}"
					style="grid-column: 2; grid-row: 1; width: 50px; height: 50px;">
				</piece>
			</a>
			<a href="javascript:void(0)" data-piece="n" class="clvq-promotion-piece">
				<piece class="knight {{ $side }}"
					style="grid-column: 3; grid-row: 1; width: 50px; height: 50px;">
				</piece>
			</a>
			<a href="javascript:void(0)" data-piece="b" class="clvq-promotion-piece">
				<piece class="bishop {{ $side }}"
					style="grid-column: 4; grid-row: 1; width: 50px; height: 50px;">
				</piece>
			</a>
		</div>
	</div>
</div>
